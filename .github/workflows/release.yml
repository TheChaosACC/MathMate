name: Release MathMate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish this version to the Visual Studio Marketplace
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VS Code extension
        run: npm run package:vsix

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          name: MathMate ${{ github.ref_name }}
          generate_release_notes: true
          files: "*.vsix"

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' && (github.event_name == 'push' || inputs.publish_marketplace == true) }}
        run: npx vsce publish --pat "$VSCE_PAT"

      - name: Explain Marketplace publishing setup
        if: ${{ env.VSCE_PAT == '' && (github.event_name == 'push' || inputs.publish_marketplace == true) }}
        run: echo "Marketplace publishing skipped. Add a VSCE_PAT Actions secret, then rerun this workflow."
